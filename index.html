<!doctype html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta

      name="viewport"

      content="width=device-width, initial-scale=1, viewport-fit=cover"

    />

    <title>PotSplit</title>

    <style>

      /* Theme colors and device safe-area spacing. */
      :root {

        --felt: #0f3d2e;

        --felt-dark: #0a2a1f;

        --card: #12241c;

        --cream: #f5f1e6;

        --gold: #c9a227;

        --red: #b24444;

        --muted: #8fae9e;

        --bg: var(--felt);

        --fg: var(--cream);

        --card-bg: var(--card);

        --border: rgba(245, 241, 230, 0.14);

        box-sizing: border-box;

        padding-top: env(safe-area-inset-top, 0px);

        padding-bottom: env(safe-area-inset-bottom, 0px);

      }

      @media (prefers-color-scheme: light) {

        :root:not([data-theme="dark"]) {

          --bg: #0f3d2e;

          --fg: #f5f1e6;

          --card-bg: #12241c;

        }

      }

      html {

        scroll-padding-top: env(safe-area-inset-top, 0px);

      }

      * {

        box-sizing: border-box;

      }

      body {

        margin: 0;

        background: var(--bg);

        color: var(--fg);

        font-family:

          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

        height: 100%;

        min-height: 100vh;

        display: flex;

        flex-direction: column;

      }

      .mono {

        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      }

      /* Header, pot total, and application layout. */
      header {

        padding: 20px 20px 14px;

        text-align: center;

        border-bottom: 1px solid var(--border);

      }

      header h1 {

        margin: 0;

        font-size: 1.3rem;

        font-weight: 700;

        letter-spacing: 0.01em;

      }

      .pot {

        margin-top: 8px;

        font-size: 2.2rem;

        font-weight: 700;

        color: var(--gold);

      }

      .pot-label {

        font-size: 0.78rem;

        color: var(--muted);

      }

      main {

        flex: 1;

        overflow-y: auto;

        padding: 16px 16px 90px;

        max-width: 480px;

        margin: 0 auto;

        width: 100%;

      }

      /* Shared cards and form controls. */
      .card {

        background: var(--card-bg);

        border: 1px solid var(--border);

        border-radius: 14px;

        padding: 16px;

        margin-bottom: 14px;

      }

      .row {

        display: flex;

        justify-content: space-between;

        align-items: center;

        padding: 10px 0;

        border-bottom: 1px solid var(--border);

      }

      .row:last-child {

        border-bottom: none;

      }

      .pname {

        font-weight: 600;

      }

      .psub {

        font-size: 0.78rem;

        color: var(--muted);

      }

      input,

      select {

        width: 100%;

        padding: 12px;

        border-radius: 10px;

        border: 1px solid var(--border);

        background: var(--felt-dark);

        color: var(--fg);

        font-size: 1rem;

        margin-bottom: 10px;

      }

      input::placeholder {

        color: var(--muted);

      }

      button {

        width: 100%;

        padding: 13px;

        border-radius: 10px;

        border: none;

        background: var(--gold);

        color: var(--felt-dark);

        font-weight: 700;

        font-size: 0.98rem;

        cursor: pointer;

      }

      button.secondary {

        background: transparent;

        border: 1px solid var(--border);

        color: var(--fg);

        font-weight: 500;

      }

      /* Confirmation dialogs and group forms. */
      .reset-modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(4px);
      }

      .reset-modal {
        width: 100%;
        max-width: 420px;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--felt-dark);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .reset-modal h2 {
        margin: 0 0 8px;
        color: var(--gold);
        text-align: center;
      }

      .reset-modal-text {
        margin: 0 0 22px;
        color: var(--muted);
        text-align: center;
        line-height: 1.5;
      }

      .group-name-field {
        margin: 0 0 20px;
      }

      .group-name-field label {
        display: block;
        margin-bottom: 8px;
        color: var(--fg);
        font-size: .82rem;
        font-weight: 600;
      }

      .group-name-field input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--fg);
        font: inherit;
        outline: none;
      }

      .group-name-field input:focus {
        border-color: var(--gold);
      }

      .group-name-field input::placeholder {
        color: var(--muted);
      }

      .reset-modal-actions {
        display: grid;
        gap: 12px;
      }

      .reset-modal-actions button {
        min-height: 52px;
        border-radius: 14px;
      }

      .reset-archive {
        background: var(--gold);
        color: var(--felt-dark);
        font-weight: 700;
      }

      .reset-delete {
        background: transparent;
        border: 1px solid #c65b5b;
        color: #ff8a8a;
        font-weight: 700;
      }

      .reset-cancel {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--fg);
        font-weight: 500;
      }

      button.small {

        width: auto;

        padding: 6px 12px;

        font-size: 0.82rem;

      }

      .amt {

        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

        font-weight: 600;

      }

      .pos {

        color: #8fd19e;

      }

      .neg {

        color: #e08787;

      }

      .empty {

        color: var(--muted);

        text-align: center;

        padding: 20px 0;

        font-size: 0.9rem;

      }

      /* Player rows and buy-in history. */
      .prow {

        cursor: pointer;

      }

      .chev {

        color: var(--muted);

        font-size: 0.8rem;

        margin-left: 8px;

        transition: transform 0.15s;

      }

      .prow.open .chev {

        transform: rotate(90deg);

      }

      .buyins {

        padding: 2px 0 10px;

      }

      .brow {

        display: flex;

        align-items: center;

        gap: 10px;

        padding: 7px 0;

        font-size: 0.86rem;

      }

      .brow .btime {

        color: var(--muted);

        flex: 1;

      }

      .brow .bamt {

        width: 70px;

      }

      .brow .bamt input {

        margin: 0;

        padding: 6px 8px;

        font-size: 0.86rem;

      }

      .iconbtn {

        background: none;

        border: none;

        width: auto;

        padding: 4px 6px;

        font-size: 0.95rem;

        cursor: pointer;

        color: var(--muted);

      }

      .iconbtn:hover {

        color: var(--fg);

      }

      .iconbtn.danger:hover {

        color: var(--red);

      }

      .pdelete {

        background: none;

        border: none;

        width: auto;

        color: var(--muted);

        font-size: 1rem;

        padding: 4px 6px;

      }

      /* Bottom navigation and settlement details. */
      nav {

        position: fixed;
        z-index: 1000;

        bottom: 0;

        left: 0;

        right: 0;

        display: flex;

        background: var(--card-bg);

        border-top: 1px solid var(--border);

        padding-bottom: env(safe-area-inset-bottom, 0px);

      }

      nav button {

        flex: 1;

        background: none;

        border: none;

        color: var(--muted);

        padding: 12px 0 10px;

        border-radius: 0;

        font-weight: 600;

        font-size: 0.85rem;

      }

      nav button.active {

        color: var(--gold);

        border-top: 2px solid var(--gold);

        padding-top: 10px;

      }

      .tx {

        display: flex;

        align-items: center;

        gap: 8px;

        padding: 10px 0;

        border-bottom: 1px solid var(--border);

      }

      .tx:last-child {

        border-bottom: none;

      }

      .arrow {

        color: var(--gold);

      }

      .section-title {

        font-size: 0.78rem;

        text-transform: none;

        color: var(--muted);

        margin: 0 0 8px;

      }

      .status {

        font-size: 0.82rem;

        color: var(--muted);

        text-align: center;

        margin-top: -6px;

        margin-bottom: 12px;

      }


      /* Authentication and group status controls. */
      .authbar { margin-top: 10px; display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; }
      .authbar button { padding:7px 12px; font-size:.78rem; width:auto; }
      .auth-user { color:var(--muted); font-size:.76rem; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

      .group-bar {
        margin-top: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .group-bar span {
        color: var(--muted);
        font-size: .76rem;
      }

      .group-bar button {
        padding: 7px 12px;
        font-size: .78rem;
        width: auto;
      }
    </style>

  </head>

  <body>

    <!-- Pot total, sign-in, and group controls. -->
    <header>

      <h1>PotSplit</h1>

      <div class="pot" id="potTotal">0 kr</div>

      <div class="pot-label">total in play</div>
      <div class="authbar">
        <span class="auth-user" id="authUser">View only</span>
        <button id="authButton" class="secondary" type="button" onclick="toggleSignIn()">Sign in to edit</button>
      </div>

      <div id="groupBar" class="group-bar">
        <span id="groupStatus" onclick="openGroupDetails()" style="cursor:pointer;">No poker group selected</span>
        <button id="createGroupButton" class="secondary" type="button" onclick="createGroup()">
          Create Group
        </button>
        <button id="joinGroupButton" class="secondary" type="button" onclick="joinGroup()">
          Join Group
        </button>
      </div>

    </header>

    <!-- Active tab content is rendered here. -->
    <main id="main"></main>

    <!-- Primary application navigation. -->
    <nav>

      <button id="tabBuy" class="active" onclick="setTab('buy')">

        Buy-ins

      </button>

      <button id="tabCash" onclick="setTab('cash')">Cashout</button>

      <button id="tabSettle" onclick="setTab('settle')">Settle</button>
      <button id="tabArchive" onclick="setTab('archive')">Archive</button>

    </nav>



    <!-- Firebase SDKs for authentication and shared data. -->
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

    <script>
      // Firebase connection and application state.
      const firebaseConfig = {
        apiKey: "AIzaSyC7dL55XgkFQ0XdRtJaRNiTda8F7FvesSU",
        authDomain: "poker-night-22bd4.firebaseapp.com",
        projectId: "poker-night-22bd4",
        storageBucket: "poker-night-22bd4.firebasestorage.app",
        messagingSenderId: "936670676256",
        appId: "1:936670676256:web:bec1d7838795d02da68345",
        measurementId: "G-Q8GFY5SQ7E"
      };
      firebase.initializeApp(firebaseConfig);
      const firestore = firebase.firestore();
      const auth = firebase.auth();
      const provider = new firebase.auth.GoogleAuthProvider();

      let state = { players: {} };

      let tab = "buy";

      let expanded = {};

      let editing = null; // "name|idx" of buy-in currently being edited

      let dbDoc = null;
      let currentUser = null;
      let unsubscribeSession = null;
      let unsubscribeMembership = null;
      let activeMembershipId = null;
      let sessionGeneration = 0;
      let archiveGeneration = 0;
      let confirmedSessionPlayers = null;

      // Multiplayer group state
      let currentGroupId = null;
      let currentGroup = null;
      let currentMember = null;

      // Get the signed-in user's Firestore document.
      function getUserRoot() {
        if (!currentUser) return null;
        return firestore.collection("users").doc(currentUser.uid);
      }

      // Get the selected group's document.
      function getGroupRef(groupId = currentGroupId) {
        if (!groupId) return null;
        return firestore.collection("groups").doc(groupId);
      }

      // Get the user's saved group selection.
      function getUserGroupProfileRef() {
        const userRoot = getUserRoot();
        return userRoot ? userRoot.collection("profile").doc("group") : null;
      }

      // Get a group member document.
      function getGroupMemberRef(groupId = currentGroupId, userId = currentUser?.uid) {
        const groupRef = getGroupRef(groupId);
        if (!groupRef || !userId) return null;
        return groupRef.collection("members").doc(userId);
      }

      // Get the user's personal archive.
      function getUserArchive() {
        const userRoot = getUserRoot();
        return userRoot ? userRoot.collection("archive") : null;
      }

      // Get the group's active session.
      function getGroupSessionRef(groupId = currentGroupId) {
        const groupRef = getGroupRef(groupId);
        return groupRef ? groupRef.collection("session").doc("main") : null;
      }

      // Get the group's game archive.
      function getGroupArchive(groupId = currentGroupId) {
        const groupRef = getGroupRef(groupId);
        return groupRef ? groupRef.collection("archive") : null;
      }

      // Check whether the user owns the group.
      function isCurrentUserBank() {
        return !!currentUser &&
               !!currentGroup &&
               currentGroup.bankId === currentUser.uid;
      }

      // Check whether the user can edit the session.
      function canEditCurrentSession() {
        if (!currentUser) return false;
        if (!currentGroupId) return true;
        return isCurrentUserBank();
      }

      let archivedGames = [];
      let archiveLoaded = false;

      // Load archived games from Firestore.
      async function loadArchive() {
        const generation = ++archiveGeneration;

        if (!currentUser) {
          archivedGames = [];
          archiveLoaded = true;
          render();
          return;
        }

        try {
          const archiveRef = currentGroupId
            ? getGroupArchive(currentGroupId)
            : getUserArchive();

          const snap = await archiveRef
            .orderBy("archivedAt", "desc")
            .get();

          if (generation !== archiveGeneration) return;

          archivedGames = snap.docs.map((doc) => ({
            id: doc.id,
            ...doc.data()
          }));

          archiveLoaded = true;
        } catch (e) {
          if (generation !== archiveGeneration) return;
          console.error("Archive load failed", e);
          archivedGames = [];
          archiveLoaded = true;
          alert("Could not load your game archive.");
        }

        render();
      }

      // Calculate payments for an archived game.
      function calcArchivedSettlement(players) {
        const balances = Object.entries(players || {})
          .map(([name, player]) => ({
            name,
            balance:
              Number(player.cashout || 0) - totalBuyIn(player)
          }))
          .filter((player) => Math.abs(player.balance) > 0.01);

        const debtors = balances
          .filter((player) => player.balance < 0)
          .map((player) => ({
            name: player.name,
            amount: -player.balance
          }));

        const creditors = balances
          .filter((player) => player.balance > 0)
          .map((player) => ({
            name: player.name,
            amount: player.balance
          }));

        const payments = [];

        let debtorIndex = 0;
        let creditorIndex = 0;

        while (
          debtorIndex < debtors.length &&
          creditorIndex < creditors.length
        ) {
          const debtor = debtors[debtorIndex];
          const creditor = creditors[creditorIndex];

          const amount = Math.min(debtor.amount, creditor.amount);

          if (amount > 0.01) {
            payments.push({
              from: debtor.name,
              to: creditor.name,
              amount
            });
          }

          debtor.amount -= amount;
          creditor.amount -= amount;

          if (debtor.amount <= 0.01) debtorIndex++;
          if (creditor.amount <= 0.01) creditorIndex++;
        }

        return payments;
      }

      // Delete an archived game after permission checks.
      async function deleteArchivedGame(id) {
        if (!auth.currentUser) {
          alert("Sign in with Google to delete an archived game.");
          return;
        }

        if (!canEditCurrentSession()) {
          alert("Only the Bank can delete archived games from this poker group.");
          return;
        }

        if (!confirm("Permanently delete this archived game? This cannot be undone.")) {
          return;
        }

        try {
          const archiveRef = currentGroupId
            ? getGroupArchive(currentGroupId)
            : getUserArchive();

          if (!archiveRef) {
            throw new Error("No signed-in user.");
          }

          await archiveRef.doc(id).delete();
          await loadArchive();
        } catch (e) {
          console.error("Archive delete failed", e);
          alert("Could not delete the archived game.");
        }
      }

      // Update the sign-in controls.
      function updateAuthUi() {
        const userEl = document.getElementById("authUser");
        const btn = document.getElementById("authButton");
        if (!userEl || !btn) return;
        if (currentUser) {
          userEl.textContent = currentUser.email || currentUser.displayName || "Signed in";
          btn.textContent = "Sign out";
        } else {
          userEl.textContent = "View only";
          btn.textContent = "Sign in to edit";
        }
      }

      // Handle web or Android Google sign-in.
      async function toggleSignIn() {
        try {
          const isNative =
            window.Capacitor &&
            window.Capacitor.isNativePlatform &&
            window.Capacitor.isNativePlatform();

          if (auth.currentUser) {
            await auth.signOut();

            if (isNative && window.Capacitor.Plugins.FirebaseAuthentication) {
              await window.Capacitor.Plugins.FirebaseAuthentication.signOut();
            }

            return;
          }

          if (isNative && window.Capacitor.Plugins.FirebaseAuthentication) {
            const result =
              await window.Capacitor.Plugins.FirebaseAuthentication.signInWithGoogle({
                skipNativeAuth: true
              });

            if (!result.credential || !result.credential.idToken) {
              throw new Error("Google Sign-In did not return an ID token.");
            }

            const credential = firebase.auth.GoogleAuthProvider.credential(
              result.credential.idToken
            );

            await auth.signInWithCredential(credential);
          } else {
            await auth.signInWithPopup(provider);
          }
        } catch (e) {
          console.error(e);
          alert("Sign-in failed: " + (e.message || e));
        }
      }

      // Generate a six-character invitation code.
      function generateGroupCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        const values = new Uint32Array(6);
        crypto.getRandomValues(values);

        return Array.from(
          values,
          (value) => chars[value % chars.length]
        ).join("");
      }

      // Display group details and member controls.
      async function openGroupDetails() {
        if (!currentUser || !currentGroupId || !currentGroup) {
          alert("No poker group selected.");
          return;
        }

        const existing = document.getElementById("groupDetailsModal");
        if (existing) existing.remove();

        try {
          const membersSnap = await getGroupRef()
            .collection("members")
            .get();

          const members = [
            {
              id: currentGroup.bankId,
              userId: currentGroup.bankId,
              name: currentGroup.bankName || "Bank",
              role: "bank"
            },
            ...membersSnap.docs
              .map((doc) => ({
                id: doc.id,
                ...doc.data()
              }))
              .filter((member) => member.userId !== currentGroup.bankId)
          ];

          members.sort((a, b) => {
            if (a.userId === currentGroup.bankId) return -1;
            if (b.userId === currentGroup.bankId) return 1;
            return (a.name || "").localeCompare(b.name || "");
          });

          const memberRows = members.map((member) => {
            const isBank = member.userId === currentGroup.bankId;
            const canRemove = isCurrentUserBank() && !isBank;

            return `
              <div style="padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;">
                <div>
                  <div style="font-weight:700;">
                    ${esc(member.name || "Member")}
                  </div>
                  <div style="margin-top:3px;color:var(--muted);font-size:.78rem;">
                    ${isBank ? "Bank" : "Member"}
                  </div>
                </div>

                ${canRemove ? `
                  <button
                    class="reset-delete"
                    style="width:auto;padding:8px 12px;min-height:auto;"
                    onclick="removeGroupMember('${escJs(member.userId)}', '${escJs(member.name || "Member")}')"
                  >
                    Remove
                  </button>
                ` : ""}
              </div>
            `;
          }).join("");

          const overlay = document.createElement("div");
          overlay.id = "groupDetailsModal";
          overlay.className = "reset-modal-overlay";

          overlay.innerHTML = `
            <div class="reset-modal" role="dialog" aria-modal="true" aria-labelledby="groupDetailsModalTitle">
              <h2 id="groupDetailsModalTitle">${esc(currentGroup.name)}</h2>

              <p class="reset-modal-text">
                Bank: ${esc(currentGroup.bankName)}<br>
                Group Code: <strong>${esc(currentGroup.groupCode)}</strong>
              </p>

              <div style="margin-bottom:22px;">
                <div style="margin-bottom:6px;color:var(--gold);font-weight:700;">
                  Members
                </div>

                ${memberRows || `
                  <div style="color:var(--muted);font-size:.82rem;">
                    No members found.
                  </div>
                `}
              </div>

              <div class="reset-modal-actions">
                <button class="reset-cancel" onclick="closeGroupDetails()">
                  Close
                </button>
              </div>
            </div>
          `;

          overlay.addEventListener("click", (event) => {
            if (event.target === overlay) closeGroupDetails();
          });

          document.body.appendChild(overlay);

        } catch (e) {
          console.error("Group members load failed", e);
          alert("Could not load poker group members.");
        }
      }

      // Remove a member as the Bank.
      async function removeGroupMember(userId, memberName) {
        if (!currentUser || !currentGroupId || !isCurrentUserBank()) {
          alert("Only the Bank can remove group members.");
          return;
        }

        if (userId === currentGroup.bankId) {
          alert("The Bank cannot be removed from the group.");
          return;
        }

        const confirmed = confirm(
          `Remove ${memberName} from ${currentGroup.name}?`
        );

        if (!confirmed) return;

        try {
          const memberRef = getGroupMemberRef(currentGroupId, userId);

          if (!memberRef) {
            throw new Error("Member reference could not be created.");
          }

          await memberRef.delete();

          closeGroupDetails();
          await openGroupDetails();

        } catch (e) {
          console.error("Group member removal failed", e);
          alert("Could not remove this member from the poker group.");
        }
      }

      // Close the group details dialog.
      function closeGroupDetails() {
        const modal = document.getElementById("groupDetailsModal");
        if (modal) modal.remove();
      }

      // Open the create-group dialog.
      function createGroup() {
        if (!currentUser) {
          alert("Sign in with Google before creating a poker group.");
          return;
        }

        const existing = document.getElementById("createGroupModal");
        if (existing) existing.remove();

        const overlay = document.createElement("div");
        overlay.id = "createGroupModal";
        overlay.className = "reset-modal-overlay";

        overlay.innerHTML = `
          <div class="reset-modal" role="dialog" aria-modal="true" aria-labelledby="createGroupModalTitle">
            <h2 id="createGroupModalTitle">Create Poker Group</h2>

            <p class="reset-modal-text">
              Create a group you can reuse for every poker night.
            </p>

            <div class="group-name-field">
              <label for="groupNameInput">Group name</label>
              <input

      // Stop listening for membership changes.
      function stopMembershipListener() {
        if (unsubscribeMembership) {
          unsubscribeMembership();
          unsubscribeMembership = null;

      // Disconnect a removed group member.
      async function handleMembershipRemoval(groupId, userId) {
        if (!currentUser ||
            currentUser.uid !== userId ||
            currentGroupId !== groupId) {
          return;
        }

        const removedMembershipId = activeMembershipId;
        stopMembershipListener();
        activeMembershipId = null;

        // Disconnect immediately from the removed group.
        currentGroupId = null;
        currentGroup = null;
        currentMember = null;

        updateGroupUi();
        subscribeToSession();

        archivedGames = [];
        archiveLoaded = false;
        loadArchive();

        try {
          const profileRef = getUserGroupProfileRef();

          await firestore.runTransaction(async (transaction) => {
            const profileSnap = await transaction.get(profileRef);

            if (profileSnap.exists &&
                profileSnap.data().groupId === groupId &&
                (profileSnap.data().membershipId || null) ===
                  removedMembershipId) {
              transaction.delete(profileRef);
            }
          });
        } catch (e) {
          console.error("Could not clear removed group profile", e);
        }

        if (currentUser &&
            currentUser.uid === userId &&
            !currentGroupId) {
          alert("You have been removed from the poker group.");
        }
      }

      // Watch membership changes in real time.
      function subscribeToMembership() {
        stopMembershipListener();

        if (!currentUser ||
            !currentGroupId ||
            isCurrentUserBank()) {
          return;
        }

        const groupId = currentGroupId;
        const userId = currentUser.uid;
        const memberRef = getGroupMemberRef(groupId, userId);

        unsubscribeMembership = memberRef.onSnapshot(
          (snap) => {
            if (!currentUser ||
                currentUser.uid !== userId ||
                currentGroupId !== groupId) {
              return;
            }

            if (!snap.exists) {
              handleMembershipRemoval(groupId, userId);
            } else {
              currentMember = snap.data();
            }
          },
          (e) => {
            console.error("Membership listener failed", e);

            if (e.code === "permission-denied" &&
                currentUser &&
                currentUser.uid === userId &&
                currentGroupId === groupId) {
              handleMembershipRemoval(groupId, userId);
            }
          }
        );
      }
      // Watch the active session in real time.
      function subscribeToSession() {
        const generation = ++sessionGeneration;
        confirmedSessionPlayers = null;

        if (unsubscribeSession) {
          unsubscribeSession();
          unsubscribeSession = null;
        }

        if (!currentUser) {
          dbDoc = null;
          state = { players: {} };
          render();
          return;
        }

        const userRoot = getUserRoot();

        dbDoc = currentGroupId
          ? getGroupSessionRef(currentGroupId)
          : userRoot.collection("session").doc("main");

        state = { players: {} };
        render();

        unsubscribeSession = dbDoc.onSnapshot({ includeMetadataChanges: true },
          (snap) => {
            if (generation !== sessionGeneration) return;
            if (!snap.metadata.fromCache && !snap.metadata.hasPendingWrites) {
              confirmedSessionPlayers = JSON.stringify(
                snap.exists ? (snap.data().players || {}) : {}
              );
            }

            const incomingState = snap.exists
              ? snap.data()
              : { players: {} };

            const normalizedState = incomingState && incomingState.players
              ? incomingState
              : { players: {} };

            // Metadata-only changes should not redraw the interface.
            if (JSON.stringify(state) !== JSON.stringify(normalizedState)) {
              state = normalizedState;
              render();
            }
          },
          (e) => {
            if (generation !== sessionGeneration) return;
            console.error("Firestore read failed", e);

            // Membership removal can revoke group session access.
            // The membership listener handles disconnection.
            if (e.code === "permission-denied" && currentGroupId) {
              return;
            }

            state = { players: {} };
            alert("Could not load your PotSplit data.");
            render();
          }
        );
      }
      // Initialize authentication and data listeners.
      async function initStorage() {
        auth.onAuthStateChanged(async (user) => {
          stopMembershipListener();
          ++sessionGeneration;
          ++archiveGeneration;
          currentUser = user;

          if (unsubscribeSession) {
            unsubscribeSession();

          }

          state = { players: {} };

      // Serialize session operations to preserve their order.
      let sessionWriteQueue = Promise.resolve();
      let activeSessionOperations = 0;

      function queueSessionWrite(operation) {
        const result = sessionWriteQueue.then(async () => {
          activeSessionOperations++;

          try {
            return await operation();
          } finally {
            activeSessionOperations--;
          }
        });

        sessionWriteQueue = result.catch(() => {});
        return result;
      }

      // Apply a session change against the latest Firestore data.
      async function updateSessionTransaction(sessionRef, change) {
        return firestore.runTransaction(async (transaction) => {
          const snapshot = await transaction.get(sessionRef);
          const latest = snapshot.exists
            ? snapshot.data()
            : { players: {} };

          if (!latest.players) {
            latest.players = {};
          }

          const updated = change(latest);

          transaction.set(sessionRef, updated);
          return updated;
        });
      }
      // Queue an edit and apply it to the latest session.
      function applySessionChange(change) {
        const sessionRef = dbDoc;
        const generation = sessionGeneration;
        const userId = currentUser ? currentUser.uid : null;

        if (!sessionRef || !userId || !canEditCurrentSession()) {
          alert("You do not have permission to edit this session.");
          return Promise.resolve(false);
        }

        return queueSessionWrite(async () => {
          if (
            generation !== sessionGeneration ||
            sessionRef !== dbDoc ||
            !currentUser ||
            currentUser.uid !== userId ||
            !canEditCurrentSession()
          ) {
            return false;
          }

          try {
            await updateSessionTransaction(sessionRef, change);

            // The transaction succeeded. A refresh failure must not
            // incorrectly report that the edit was rejected.
            try {
              const confirmed = await sessionRef.get({
                source: "server"
              });

              if (
                generation === sessionGeneration &&
                sessionRef === dbDoc &&
                currentUser &&
                currentUser.uid === userId
              ) {
                state = confirmed.exists
                  ? confirmed.data()
                  : { players: {} };

                if (!state || !state.players) {
                  state = { players: {} };
                }

                render();
              }
            } catch (refreshError) {
              console.warn(
                "Session saved, but server refresh failed",
                refreshError
              );
              alert(
                "Your change was saved, but the session could not be refreshed. Check your connection."
              );
            }

            return true;
          } catch (e) {
            console.error("Session update failed", e);
            alert("Could not save your session change.");
            return false;
          }
        });
      }
      // Save permitted session changes to Firestore.
      async function saveState() {
        if (!auth.currentUser || !currentUser || !dbDoc) {
          alert("Sign in with Google to edit your PotSplit.");
          return;
        }

        if (!canEditCurrentSession()) {
          alert("Only the Bank can edit this poker group.");
          return;
        }

        try {
          await dbDoc.set(state);
        } catch (e) {
          console.error("Firestore write failed", e);
          alert("Could not save your PotSplit data.");
        }
      }

      // Sum a player's buy-ins.
      function totalBuyIn(p) {

        return (p.buyIns || []).reduce((s, b) => s + b.amount, 0);

      }

      // Sum all players' buy-ins.
      function potTotal() {

        return Object.values(state.players).reduce(

          (s, p) => s + totalBuyIn(p),

          0,

        );

      }



      // Add a buy-in for a player.
      function addBuyIn() {
        if (!canEditCurrentSession()) {
          alert("Only the Bank can edit this poker group.");
          return;
        }

        const nameInput = document.getElementById("nameInput");
        const amountInput = document.getElementById("amountInput");

        const enteredName = nameInput.value.trim();
        const amount = parseFloat(amountInput.value);

        if (!enteredName || !Number.isFinite(amount) || amount <= 0) return;

        const buyIn = {
          amount,
          time: new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
          })
        };

        applySessionChange((latest) => {
          const existingName = Object.keys(latest.players).find(
            (name) => name.toLowerCase() === enteredName.toLowerCase()
          );

          const name = existingName || enteredName;

          if (!latest.players[name]) {
            latest.players[name] = { buyIns: [], cashout: null };
          }

          latest.players[name].buyIns.push(buyIn);
          return latest;
        }).then((saved) => {
          if (saved) {
            amountInput.value = "";
          }
        });
      }
      // Set a player's cashout amount.
      function setCashout(name, val) {
        if (!canEditCurrentSession()) {
          alert("Only the Bank can edit this poker group.");
          return;
        }

        const amount = parseFloat(val);
        const cashout = Number.isFinite(amount) ? amount : null;

        applySessionChange((latest) => {
          if (!latest.players[name]) {
            throw new Error("PLAYER_NOT_FOUND");
          }

          latest.players[name].cashout = cashout;
          return latest;
        });
      }

      // Save an edited buy-in.
      function saveEdit(name, idx, val) {
        if (!canEditCurrentSession()) {
          alert("Only the Bank can edit this poker group.");
          return;
        }

        const amount = parseFloat(val);

        if (!Number.isFinite(amount) || amount <= 0) {
          return;
        }

        const originalBuyIn = state.players[name]?.buyIns?.[idx];

        if (!originalBuyIn) {
          alert("This buy-in is no longer available.");
          return;
        }

        const expectedBuyIn = JSON.stringify(originalBuyIn);

        applySessionChange((latest) => {
          const player = latest.players[name];

          if (
            !player ||
            !player.buyIns[idx] ||
            JSON.stringify(player.buyIns[idx]) !== expectedBuyIn
          ) {
            throw new Error("BUYIN_CHANGED");
          }

          player.buyIns[idx].amount = amount;
          return latest;
        }).then((saved) => {
          if (saved) {
            editing = null;
            render();
          }
        });
      }
      // Delete a buy-in after confirmation.
      function deleteBuyIn(name, idx) {
        if (!canEditCurrentSession()) {
          alert("Only the Bank can edit this poker group.");
          return;
        }

        const originalBuyIn = state.players[name]?.buyIns?.[idx];

        if (!originalBuyIn) {
          alert("This buy-in is no longer available.");
          return;
        }

        if (!confirm("Delete this buy-in?")) return;

        const expectedBuyIn = JSON.stringify(originalBuyIn);

        applySessionChange((latest) => {
          const player = latest.players[name];

          if (
            !player ||
            !player.buyIns ||
            !player.buyIns[idx] ||
            JSON.stringify(player.buyIns[idx]) !== expectedBuyIn
          ) {
            throw new Error("BUYIN_CHANGED");
          }

          player.buyIns.splice(idx, 1);

          if (
            player.buyIns.length === 0 &&
            (player.cashout === null || player.cashout === undefined)
          ) {
            delete latest.players[name];
          }

          return latest;
        });
      }
      // Remove a player and their buy-ins.
      function deletePlayer(name) {
        if (!canEditCurrentSession()) {
          alert("Only the Bank can edit this poker group.");
          return;
        }

        const originalPlayer = state.players[name];

        if (!originalPlayer) {
          alert("This player is no longer available.");
          return;
        }

        if (!confirm(`Remove ${name} and all their buy-ins?`)) return;

        const expectedPlayer = JSON.stringify(originalPlayer);

        applySessionChange((latest) => {
          const player = latest.players[name];

          if (
            !player ||
            JSON.stringify(player) !== expectedPlayer
          ) {
            throw new Error("PLAYER_CHANGED");
          }

          delete latest.players[name];
          return latest;
        });
      }
      // Start the session reset flow.

      // Archive the game before clearing the session.
      async function archiveAndResetSession() {
        if (!canEditCurrentSession() || !dbDoc) {
          alert("Only the Bank can reset this poker group.");
          return;
        }

        const sessionRef = dbDoc;
        const generation = sessionGeneration;
        const userId = currentUser.uid;
        const archiveRef = currentGroupId
          ? getGroupArchive(currentGroupId)
          : getUserArchive();

        if (!archiveRef) {
          alert("No archive is available.");
          return;
        }

        await queueSessionWrite(async () => {
          if (
            generation !== sessionGeneration ||
            sessionRef !== dbDoc ||
            !currentUser ||
            currentUser.uid !== userId ||
            !canEditCurrentSession()
          ) {
            alert("The active session changed. Archive cancelled.");
            return;
          }

          try {
            if (confirmedSessionPlayers === null) {
              throw new Error("SESSION_NOT_CONFIRMED");
            }

            if (
              !resetModalSession ||
              resetModalSession.generation !== generation ||
              resetModalSession.sessionRef !== sessionRef ||
              resetModalSession.players !== confirmedSessionPlayers
            ) {
              throw new Error("SESSION_CHANGED");
            }

            const expectedPlayers = resetModalSession.players;
            const archiveDoc = archiveRef.doc();

            await firestore.runTransaction(async (transaction) => {
              const snapshot = await transaction.get(sessionRef);
              const savedPlayers = snapshot.exists
                ? (snapshot.data().players || {})
                : {};

              if (JSON.stringify(savedPlayers) !== expectedPlayers) {
                throw new Error("SESSION_CHANGED");
              }

              transaction.set(archiveDoc, {
                players: savedPlayers,
                archivedAt: firebase.firestore.FieldValue.serverTimestamp()
              });

              transaction.set(sessionRef, { players: {} });
            });

            if (
              generation === sessionGeneration &&
              sessionRef === dbDoc
            ) {
              state = { players: {} };
              render();
              closeResetModal();
            }
          } catch (e) {
            console.error("Archive/reset failed", e);
            alert(e.message === "SESSION_CHANGED"
              ? "The session changed. Review the latest game before archiving."
              : "Could not archive the game. The current session was not cleared.");
          }
        });
      }
      // Discard the game and clear the session.
      async function confirmDeleteAndResetSession() {
        if (!canEditCurrentSession() || !dbDoc) {
          alert("Only the Bank can reset this poker group.");
          return;
        }

        const confirmed = confirm(
          "Permanently delete this game without saving it to Archive?"
        );

        if (!confirmed) return;

        const sessionRef = dbDoc;
        const generation = sessionGeneration;
        await queueSessionWrite(async () => {
          if (
            generation !== sessionGeneration ||
            sessionRef !== dbDoc ||
            !canEditCurrentSession()
          ) {
            alert("The active session changed. Delete cancelled.");
            return;
          }

          try {
            if (confirmedSessionPlayers === null) {
              throw new Error("SESSION_NOT_CONFIRMED");
            }

            if (
              !resetModalSession ||
              resetModalSession.generation !== generation ||
              resetModalSession.sessionRef !== sessionRef ||
              resetModalSession.players !== confirmedSessionPlayers
            ) {
              throw new Error("SESSION_CHANGED");
            }

            const expectedPlayers = resetModalSession.players;

            await firestore.runTransaction(async (transaction) => {
              const snapshot = await transaction.get(sessionRef);
              const savedPlayers = snapshot.exists
                ? (snapshot.data().players || {})
                : {};

              if (JSON.stringify(savedPlayers) !== expectedPlayers) {
                throw new Error("SESSION_CHANGED");
              }

              transaction.set(sessionRef, { players: {} });
            });

            if (generation === sessionGeneration) {
              state = { players: {} };
              render();
              closeResetModal();
            }
          } catch (e) {
            console.error("Delete/reset failed", e);
            alert(e.message === "SESSION_CHANGED"
              ? "The session changed. Review the latest game before deleting."
              : "Could not delete the game. The current session was not cleared.");
          }
        });
      }
      // Calculate balances and settlement payments.
      function calcSettlement() {

        const names = Object.keys(state.players);

        const missing = names.filter(

          (n) =>

            state.players[n].cashout === null ||

            state.players[n].cashout === undefined,

        );

        if (missing.length)

          return { error: "Waiting on cashout from: " + missing.join(", ") };

        const balances = names.map((n) => ({

          name: n,

          net: round2(state.players[n].cashout - totalBuyIn(state.players[n])),

        }));

        const totalIn = round2(

          names.reduce((s, n) => s + totalBuyIn(state.players[n]), 0),

        );

        const totalOut = round2(

          names.reduce((s, n) => s + state.players[n].cashout, 0),

        );

        let warning = null;

        if (Math.abs(totalIn - totalOut) > 0.01)

          warning = `Buy-ins (${totalIn} kr) and cashouts (${totalOut} kr) don't match — check the numbers.`;

        let debtors = balances

          .filter((b) => b.net < -0.01)

          .map((b) => ({ name: b.name, amt: -b.net }))

          .sort((a, b) => b.amt - a.amt);

        let creditors = balances

          .filter((b) => b.net > 0.01)

          .map((b) => ({ name: b.name, amt: b.net }))

          .sort((a, b) => b.amt - a.amt);

        const txs = [];

        let i = 0,

          j = 0;

        while (i < debtors.length && j < creditors.length) {

          const pay = round2(Math.min(debtors[i].amt, creditors[j].amt));

          if (pay > 0.01)

            txs.push({

              from: debtors[i].name,

              to: creditors[j].name,

              amt: pay,

            });

          debtors[i].amt -= pay;

          creditors[j].amt -= pay;

          if (debtors[i].amt <= 0.01) i++;

          if (creditors[j].amt <= 0.01) j++;

        }

        return { txs, balances, warning };

      }

      // Round a number to two decimal places.
      function round2(n) {

        return Math.round(n * 100) / 100;

      }



      // Render the current application view.
      function render() {

        const canEdit = canEditCurrentSession();

        document.getElementById("potTotal").textContent =

          potTotal().toFixed(0) + " kr";

        const main = document.getElementById("main");

        const names = Object.keys(state.players);



        if (tab === "buy") {

          main.innerHTML = `

      ${canEdit ? `
      <div class="card">

        <p class="section-title">Log a buy-in</p>

        <input id="nameInput" placeholder="Player name" list="playerList">

        <datalist id="playerList">${names.map((n) => `<option value="${esc(n)}">`).join("")}</datalist>

        <input id="amountInput" type="number" inputmode="decimal" placeholder="Amount (kr)">

        <button onclick="addBuyIn()">Add buy-in</button>

      </div>
      ` : `
      <div class="status">
        Read only - only the Bank can edit this poker group.
      </div>
      `}

      <div class="card">

        <p class="section-title">Players (tap to view buy-ins)</p>

        ${

          names.length

            ? names

                .map((n) => {

                  const p = state.players[n];

                  const isOpen = !!expanded[n];

                  const buyinsHtml = p.buyIns

                    .map((b, idx) => {

                      const isEditing = editing === n + "|" + idx;

                      return `<div class="brow">

              <span class="btime">${esc(b.time || "")}</span>

              ${

                isEditing

                  ? `<span class="bamt"><input type="number" inputmode="decimal" value="${b.amount}" autofocus onblur="saveEdit('${escJs(n)}',${idx},this.value)" onkeydown="if(event.key==='Enter')this.blur()"></span>`

                  : `<span class="amt">${b.amount.toFixed(0)} kr</span>

                   ${canEdit ? `<button class="iconbtn" onclick="event.stopPropagation();startEdit('${escJs(n)}',${idx})">✎</button>` : ""}

                   ${canEdit ? `<button class="iconbtn danger" onclick="event.stopPropagation();deleteBuyIn('${escJs(n)}',${idx})">✕</button>` : ""}`

              }

            </div>`;

                    })

                    .join("");

                  return `<div class="row prow ${isOpen ? "open" : ""}" onclick="toggleExpand('${escJs(n)}')">

            <div><div class="pname">${esc(n)}<span class="chev">▸</span></div><div class="psub">${p.buyIns.length} buy-in${p.buyIns.length !== 1 ? "s" : ""}</div></div>

            <div style="display:flex;align-items:center;">

              <span class="amt">${totalBuyIn(p).toFixed(0)} kr</span>

              ${canEdit ? `<button class="pdelete" onclick="event.stopPropagation();deletePlayer('${escJs(n)}')">✕</button>` : ""}

            </div>

          </div>

          ${isOpen ? `<div class="buyins">${buyinsHtml}</div>` : ""}`;

                })

                .join("")

            : `<div class="empty">${canEdit ? "No buy-ins yet - add the first one above." : "No buy-ins yet."}</div>`

        }

      </div>

      ${canEdit ? `<button class="secondary" onclick="resetSession()">Reset session</button>` : ""}

    `;

        } else if (tab === "cash") {

          main.innerHTML = `

      <div class="card">

        <p class="section-title">Final chip count per player</p>

        ${

          names.length

            ? names

                .map((n) => {

                  const p = state.players[n];

                  return `<div class="row"><div><div class="pname">${esc(n)}</div><div class="psub">bought in ${totalBuyIn(p).toFixed(0)} kr</div></div>

          ${canEdit
            ? `<input style="width:100px;margin:0" type="number" inputmode="decimal" placeholder="kr" value="${p.cashout ?? ""}" onchange="setCashout('${escJs(n)}', this.value)">`
            : `<span class="amt">${p.cashout == null ? "-" : p.cashout.toFixed(0) + " kr"}</span>`
          }</div>`;

                })

                .join("")

            : '<div class="empty">Add players on the Buy-ins tab first.</div>'

        }

      </div>

    `;

        } else if (tab === "settle") {

          const r = calcSettlement();

          if (!names.length) {

            main.innerHTML =

              '<div class="card"><div class="empty">Add players and buy-ins first.</div></div>';

          } else if (r.error) {

            main.innerHTML = `<div class="card"><div class="empty">${esc(r.error)}</div></div>`;

          } else {

            main.innerHTML = `

        ${r.warning ? `<div class="status">${esc(r.warning)}</div>` : ""}

        <div class="card">

          <p class="section-title">Payments</p>

          ${r.txs.length ? r.txs.map((t) => `<div class="tx"><span class="pname">${esc(t.from)}</span><span class="arrow">→</span><span class="pname">${esc(t.to)}</span><span class="amt" style="margin-left:auto">${t.amt.toFixed(0)} kr</span></div>`).join("") : '<div class="empty">Everyone\'s even — no payments needed.</div>'}

        </div>

        <div class="card">

          <p class="section-title">Net result</p>

          ${r.balances.map((b) => `<div class="row"><span class="pname">${esc(b.name)}</span><span class="amt ${b.net >= 0 ? "pos" : "neg"}">${b.net >= 0 ? "+" : ""}${b.net.toFixed(0)} kr</span></div>`).join("")}

        </div>

      `;

          }

        } else if (tab === "archive") {

          if (!archiveLoaded) {
            main.innerHTML =
              '<div class="card"><div class="empty">Loading archive...</div></div>';

          } else if (!archivedGames.length) {
            main.innerHTML =
              '<div class="card"><div class="empty">No archived games yet.</div></div>';

          } else {
            main.innerHTML = archivedGames.map((game) => {
              const gamePlayers = game.players || {};
              const gameNames = Object.keys(gamePlayers);

              const gameTotal = Object.values(gamePlayers).reduce(
                (sum, player) => sum + totalBuyIn(player),
                0,
              );

              const gameDate =
                game.archivedAt && game.archivedAt.toDate
                  ? game.archivedAt.toDate().toLocaleString()
                  : "Unknown date";

              const payments = calcArchivedSettlement(gamePlayers);

              return `<div class="card">
                <p class="section-title">${esc(gameDate)}</p>

                <div class="row">
                  <span class="pname">
                    ${gameNames.length} player${gameNames.length !== 1 ? "s" : ""}
                  </span>
                  <span class="amt">${gameTotal.toFixed(0)} kr total</span>
                </div>

                ${gameNames
                  .map((name) => {
                    const player = gamePlayers[name];

                    const cashout =
                      player.cashout === null ||
                      player.cashout === undefined
                        ? "Not entered"
                        : Number(player.cashout).toFixed(0) + " kr";

                    return `<div class="row">
                      <div>
                        <div class="pname">${esc(name)}</div>
                        <div class="psub">
                          Buy-in ${totalBuyIn(player).toFixed(0)} kr - Cashout ${cashout}
                        </div>
                      </div>
                    </div>`;
                  })
                  .join("")}

                <p class="section-title">Payments</p>

                ${
                  payments.length
                    ? payments
                        .map(
                          (payment) => `<div class="row">
                            <span>
                              <strong>${esc(payment.from)}</strong>
                              pays
                              <strong>${esc(payment.to)}</strong>
                            </span>
                            <span class="amt">${payment.amount.toFixed(0)} kr</span>
                          </div>`,
                        )
                        .join("")
                    : '<div class="empty">No payments needed.</div>'
                }

                ${canEdit ? `
                <button
                  class="secondary"
                  onclick="deleteArchivedGame('${escJs(game.id)}')"
                >
                  Delete permanently
                </button>
                ` : ""}
              </div>`;
            }).join("");
          }

        }

      }

      // Escape text for safe HTML output.
      function esc(s) {

        return String(s).replace(

          /[&<>"']/g,

          (c) =>

            ({

              "&": "&amp;",

              "<": "&lt;",

              ">": "&gt;",

              '"': "&quot;",

              "'": "&#39;",

            })[c],

        );

      }

      // Escape text for inline JavaScript handlers.
      function escJs(s) {

        return String(s).replace(/'/g, "\\\\'");

      }



      initStorage();

    </script>

  </body>
